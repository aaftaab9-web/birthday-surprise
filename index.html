<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login">
        <h1>If you get this wrong, consider us divorced! 😡</h1>
        <input type="password" id="password" placeholder="Hint: Our special word?">
        <button onclick="checkLogin()">Enter</button>
        <div id="meme-container" style="display: none; margin-top: 20px;">
            <img id="meme-img" src="" alt="Funny Meme" class="meme">
        </div>
        <!-- Floral decorations: Scattered flower emojis/images for fun -->
        <div class="flower flower1">🌻</div>
        <div class="flower flower2">🌸</div>
        <div class="flower flower3">🌷</div>
        <div class="flower flower4">🥀</div>
        <div class="flower flower5">⚘️</div>
    </div>
    
    <div id="countdown-page" style="display: none;">
        <h1>Countdown to Your Birthday!</h1>
        <p>You're turning 24 on February 25, 2026!</p>
        <div id="countdown"></div>
    </div>
    
    <div id="birthday-page" style="display: none;">
        <h1>Happy Birthday, [Her Name]! 🎉</h1>
        <p>You're now 24! Here's to an amazing year ahead. [Add your custom message here, like: I love you more every day!]</p>
        <img src="https://i.imgur.com/yourimage1.jpg" alt="Our photo 1" class="photo">
        <img src="https://i.imgur.com/yourimage2.jpg" alt="Her photo" class="photo">
        <!-- Add more <img> tags for extra pictures -->
        <canvas id="confetti-canvas"></canvas>
    </div>
    
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</body>
</html>
