<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login">
        <div class="flower-header"></div>
        <h1>If you get this wrong, consider us divorced! 😡</h1>
        <input type="password" id="password" placeholder="Hint: Our special word?">
        <button onclick="checkLogin()">Enter</button>
        <div id="meme-container" style="display: none; margin-top: 20px;">
            <img id="meme-img" src="" alt="Funny Reaction" class="meme">
        </div>
    </div>

    <div id="countdown-page" style="display: none;">
        <img id="waiting-meme" src="" alt="Waiting meme" class="waiting-meme">
        <h1>Countdown to Your Birthday!</h1>
        <p>You're turning 24 on February 25, 2026!</p>
        <div id="countdown"></div>
    </div>

    <!-- Birthday reveal sequence container (hidden initially) -->
    <div id="birthday-reveal" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; z-index: 1000;">
        <div id="black-overlay" class="black-overlay"></div>
        <div id="fireworks-layer" class="fireworks-layer"></div>
        <div class="reveal-content">
            <img src="https://media.giphy.com/media/3o7btPCcdNniyf0ArS/giphy.gif" alt="Animated Birthday Cake with Candles" class="animated-cake">
            <p id="wish-text" class="wish-text">Make a wish... Blow the candles! 🎂</p>
            <p id="blow-harder" class="wish-text" style="display:none; font-size:1.8em; color:#ff4500;">Blow harder!! 💨💨</p>
        </div>
        <div id="balloons-container"></div>
    </div>

    <div id="birthday-page" style="display: none;">
        <h1>Happy Birthday, [Her Name]! 🎉</h1>
        <p>You're now 24! [Your custom message here, e.g. I love you more every day! ❤️]</p>
        <img src="https://i.imgur.com/yourimage1.jpg" alt="Photo 1" class="photo">
        <img src="https://i.imgur.com/yourimage2.jpg" alt="Photo 2" class="photo">
        <canvas id="confetti-canvas"></canvas>
    </div>

    <!-- Audio (keep your existing ones + bgMusic) -->
    <!-- ... your audio tags here ... -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://www.orangefreesounds.com/wp-content/uploads/2016/08/Happy-birthday-instrumental.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</body>
</html>
